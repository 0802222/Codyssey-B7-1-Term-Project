{% extends "base.html" %}

{% block title %}로그인 — EasyExplain{% endblock %}

{% block content %}
<section class="auth">
  <div class="container">
    <div class="auth-card">
      <h1>로그인</h1>
      <p class="auth-lead">로그인하고 질문을 시작해요.</p>

      {# 오류 칸: 평소에는 숨겨 두고, 로그인에 실패하면 서버가 보낸 error.message 를 넣어 보여 준다 #}
      <div class="form-error" id="form-error" role="alert" tabindex="-1" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        <span id="form-error-text"></span>
      </div>

      {# method="post": 스크립트가 뜨기 전에 눌러도 비밀번호가 주소(GET 쿼리)에 붙지 않게 #}
      <form id="login-form" method="post">
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" autocomplete="email" spellcheck="false" required aria-describedby="form-error">
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="10자 이상" required aria-describedby="form-error">
        </div>
        <button class="btn btn-primary btn-block" type="submit">로그인</button>
      </form>

      <p class="auth-switch">계정이 없나요? <a href="/signup">회원가입</a></p>
    </div>
  </div>
</section>
{% endblock %}
